[platformio]
default_envs = server, client
core_dir = .pio/core

[env]
platform = platformio/espressif8266@4.2.1
platform_packages =
    platformio/framework-arduinoespressif8266@3.30102.0
    platformio/toolchain-xtensa@2.100300.220621
    platformio/tool-esptool@1.413.0
    platformio/tool-esptoolpy@1.30000.201119
board = nodemcuv2
framework = arduino
monitor_speed = 115200
build_flags = -Wall -Wextra

[env:server]
build_flags = ${env.build_flags} -DUDP_SERVER

[env:client]

[env:client2]
build_flags = ${env.build_flags} -DCLIENT_ID=2

[env:client3]
build_flags = ${env.build_flags} -DCLIENT_ID=3
